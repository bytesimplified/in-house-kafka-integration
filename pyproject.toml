[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inhouse-kafka-integration"
version = "0.1.0"
description = "Reusable Kafka producer, at-least-once consumer, and dead-letter infrastructure."
requires-python = ">=3.11"
dependencies = ["confluent-kafka>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires running Kafka broker"]
