[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inhouse-kafka-integration"
version = "0.2.0"
description = "In-house Kafka producer, delayed retries, transactional inbox and controlled DLQ replay."
requires-python = ">=3.11"
dependencies = ["confluent-kafka>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires running Kafka broker / PostgreSQL"]
