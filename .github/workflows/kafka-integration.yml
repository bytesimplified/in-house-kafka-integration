name: Kafka integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: pytest -m "not integration" -q
      - name: Start local Kafka
        run: docker compose -f compose.yaml up -d --wait
      - name: Create topics
        run: python -m inhouse_kafka init
      - name: Broker integration test
        env:
          KAFKA_INTEGRATION_TEST: "1"
        run: pytest -m integration -q
      - name: Stop local Kafka
        if: always()
        run: docker compose -f compose.yaml down -v
