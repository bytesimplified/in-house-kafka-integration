name: Kafka integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAFKA_BOOTSTRAP_SERVERS: "127.0.0.1:9092"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[test,postgres]'
      - name: Compile package
        run: python -m compileall -q src
      - name: Unit tests
        run: pytest -m "not integration" -q
      - name: Start local Kafka and PostgreSQL
        run: docker compose --profile inbox up -d --wait
      - name: Provision source, retry, and DLQ topics
        env:
          KAFKA_RETRY_MODE: topics
        run: python -m inhouse_kafka init
      - name: Broker and transactional-inbox integration tests
        env:
          KAFKA_INTEGRATION_TEST: "1"
          KAFKA_POSTGRES_DSN: "postgresql://kafka:local-dev-only@localhost:5432/kafka"
        run: pytest -m integration -q
      - name: Dump broker diagnostics on failure
        if: failure()
        run: |
          docker compose --profile inbox ps
          docker compose --profile inbox logs --tail=150 kafka
      - name: Stop local services
        if: always()
        run: docker compose --profile inbox down -v
